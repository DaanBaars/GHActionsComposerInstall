name: 'Setup Composer'
description: 'Securely installs Composer using the official installer (with checksum verification) and optionally runs an install command.'
author: 'Daan Baars'
branding:
  icon: 'package'
  color: 'orange'

inputs:
  install:
    description: 'Command to run after installing Composer. Set to an empty string to skip.'
    required: false
    default: 'composer install'
  working-directory:
    description: 'Directory in which the install command is executed.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Ensure PHP is installed
      shell: bash
      run: |
        if ! command -v php >/dev/null 2>&1; then
          echo "PHP not found on runner — installing php-cli via apt..."
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y --no-install-recommends php-cli ca-certificates
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends php-cli ca-certificates
          fi
        fi
        php --version

    - name: Install Composer
      shell: bash
      run: |
        EXPECTED_CHECKSUM="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
        php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
        ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
        if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
          echo 'ERROR: Invalid installer checksum'
          rm composer-setup.php
          exit 1
        fi
        if [ "$(id -u)" -eq 0 ]; then
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
        else
          sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
        fi
        rm composer-setup.php
        composer --version

    - name: Run install command
      if: ${{ inputs.install != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install }}
